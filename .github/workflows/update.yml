name: Run data update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"  # Run daily at 2:00 AM UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ vars.DEPLOY_BRANCH }}
          fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.

      - name: Create update branch
        run: |
          BRANCH="auto-update/run-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          echo "UPDATE_PR_BRANCH=$BRANCH" >> $GITHUB_ENV

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - run: pip install -r _explore/scripts/requirements.txt

      - name: Setup Spack # Spack is not yet pip installable, so we must install via the actions
        uses: spack/setup-spack@16b756799ede8b28951287f89bcd3fdb32ec1ca3 # v3.0.0
        with:
          spack_ref: v1.1.1
          buildcache: false
          color: false
          spack_path: spack

      - name: Download sustainability metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list \
            --repo corsa-center/metrics \
            --workflow collect-and-sync.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          if [ -z "$RUN_ID" ]; then
            echo "::warning::No successful metrics run found in corsa-center/metrics — skipping"
            exit 0
          fi

          echo "Clearing existing metrics files before download"
          rm -rf explore/github-data/*-metrics/

          echo "Downloading sustainability-metrics artifact from run $RUN_ID"
          gh run download "$RUN_ID" \
            --repo corsa-center/metrics \
            --name sustainability-metrics \
            --dir explore/github-data

          echo "Packages updated:"
          ls -d explore/github-data/*-metrics/ 2>/dev/null || echo "  (none)"

      - name: Run update script
        run:
          ./_explore/scripts/UPDATE.sh
        env:
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: check-changes
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "No changes detected"
            echo "has-changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected"
            echo "has-changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.check-changes.outputs.has-changes == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "Ran collection scripts [AUTO-GENERATED]"

      - name: Merge main into update branch
        if: steps.check-changes.outputs.has-changes == 'true'
        run: |
          PRE_MERGE=$(git rev-parse HEAD)
          git fetch origin "$DEPLOY_BRANCH"
          git merge "origin/$DEPLOY_BRANCH" -X ours --no-edit || true

          # -X ours leaves modify/delete conflicts unresolved (exits 1); resolve them explicitly.
          # UD = deleted by them, modified by us → restore our version
          # DU = deleted by us, modified by them → keep deletion
          while IFS= read -r entry; do
            status="${entry:0:2}"
            file="${entry:3}"
            if [ "$status" = "UD" ]; then
              git checkout --ours "$file"
              git add "$file"
            elif [ "$status" = "DU" ]; then
              git rm "$file"
            fi
          done < <(git status --porcelain | grep -E '^(UD|DU) ')

          # Fail if any other conflict types remain (e.g. AA, DD)
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Unresolved merge conflicts remain after auto-resolution"
            exit 1
          fi

          # Force-include data files from the pre-merge commit.
          # A prior explicit deletion in main causes git merge to skip them;
          # checking them out directly overrides that.
          git checkout "$PRE_MERGE" -- explore/github-data/
          git add explore/github-data/
          if ! git diff --staged --quiet; then
            git commit -m "Sync data files after merge with $DEPLOY_BRANCH"
          fi

      - name: Push update branch
        if: steps.check-changes.outputs.has-changes == 'true'
        run: git push --set-upstream origin "$UPDATE_PR_BRANCH"

      - name: Create pull request
        if: steps.check-changes.outputs.has-changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_REVIEWERS: "@johnwparent @jarrah42 @brtnfld"
        run: |
          REVIEWERS=$(printf '%s' "${{ env.PR_REVIEWERS }}" | sed 's/@//g' | tr -s ' ' ',' | sed 's/^,//;s/,$//')

          PR_URL=$(gh pr create \
            --title "Data update: run ${{ github.run_number }} (${{ github.run_id }})" \
            --body "Automated data update generated by workflow run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})." \
            --base "$DEPLOY_BRANCH" \
            --head "$UPDATE_PR_BRANCH")

          if [ -n "$REVIEWERS" ]; then
            gh pr edit "$PR_URL" --add-reviewer "$REVIEWERS" || true
          fi
